<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOODLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRGl7v5orE19cIJZha478cRN6WmGy65m8",
  authDomain: "bloodline-mainframe.firebaseapp.com",
  projectId: "bloodline-mainframe",
  storageBucket: "bloodline-mainframe.firebasestorage.app",
  messagingSenderId: "71863265301",
  appId: "1:71863265301:web:a4f7c594b01592ad76061c"
};

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const auth = getAuth(app);

  // Try anonymous auth
  try { await signInAnonymously(auth); } catch(e) { console.warn('Anonymous auth skipped:', e.code); }

  window._db      = db;
  window._fs      = { collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot };
  window._dbReady = true;
  document.dispatchEvent(new Event('dbReady'));
</script>

<style>
:root{
  --pink:#ff1a6d; --pink-dim:#cc1457; --pink-glow:rgba(255,26,109,.44);
  --pink-soft:rgba(255,26,109,.12); --black:#050505; --dark:#0d0d0d;
  --card:#111; --card2:#161616; --border:#1e1e1e; --text:#e8e8e8;
  --muted:#adadad; --red:#ff3355; --green:#00ff88;
}

html, body {height:100%; margin:0; padding:0;}
body {
  min-height:100vh;
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  background: var(--black);
  overflow-x:hidden;
  position:relative;
}
body::before, body::after {
  content:'';
  pointer-events:none;
  position:fixed; left:0; top:0; width:100vw; height:100vh; z-index:0;
}
body::before {
  /* Soft smoke gradient effect */
  background:
    radial-gradient(circle at 20vw 60vh, rgba(255,26,109,0.17) 0, transparent 50%),
    radial-gradient(circle at 70vw 25vh, rgba(255,26,109,0.13) 0, transparent 60%),
    linear-gradient(120deg, transparent 60%,rgba(255,26,109,0.17) 90%,transparent 100%),
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.15) 4px);
  mix-blend-mode: lighten;
  opacity:.8;
  animation: smokefade 12s linear infinite alternate;
}
body::after {
  /* Animated wavy “smoke” */
  background:
    repeating-linear-gradient(-9deg,rgba(24,0,12,.23) 0,rgba(24,0,12,0) 75px,rgba(255,26,109,.075) 200px),
    url('https://www.transparenttextures.com/patterns/smoke.png');
  background-size: 600px 600px, auto;
  mix-blend-mode:screen;
  opacity:.83;
  filter: blur(2px);
  animation: smokeMove 46s linear infinite;
}
@keyframes smokefade {
  0% {opacity:0.8;}
  100% {opacity:1;}
}
@keyframes smokeMove{
  0%{background-position:0 0,0 0;}
  100%{background-position:240px 240px,400px 0;}
}
/* Sidebar nav */
#sidebar {
  position:fixed; top:0; left:0; height:100vh; width:106px;
  background:linear-gradient(135deg, var(--dark) 88%, var(--pink-soft) 100%);
  box-shadow:3px 0 16px 0 rgba(0,0,0,0.18);
  display:flex; flex-direction:column; align-items:center;
  z-index:1020;
  padding-top:30px;
  gap:30px;
}

#sidebar .sidebar-logo {
  width:78px; height:78px; margin-bottom:18px;
  display:flex; align-items:center; justify-content:center;
  background: rgba(255,26,109,0.07);
  border-radius:50%; border: 2.5px solid var(--pink);
  box-shadow: 0 0 32px var(--pink-glow), 0 0 0px #fff;
}
#sidebar .sidebar-logo img {
  width: 74px; height:74px; object-fit:contain; 
  /* logo is centered and big! */
  filter: drop-shadow(0 0 8px var(--pink-glow));
}
#sidebar .sidebar-title {
  font-family:'Bebas Neue',cursive;
  font-size:39px;
  letter-spacing:.16em;
  color:var(--pink);
  text-shadow:0 0 54px var(--pink-glow),0 0 80px rgba(255,26,109,.27);
  margin-top:-13px;
  margin-bottom:23px;
  writing-mode: vertical-lr;
  text-orientation: mixed;
  transform: rotate(180deg); /* voodoo quirk! */
}

#sidebar .sidebar-nav {
  display:flex;
  flex-direction:column;
  width:100%;
  gap:8px;
  align-items:center;
}

.sidebar-btn {
  width:81px;
  background:none; border:none; outline:none;
  color:var(--muted); background:var(--card2);
  margin-bottom:3px;
  border-radius:7px;
  padding:14px 0 8px;
  text-align:center;
  font-family:'Rajdhani',sans-serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:.08em;
  cursor:pointer;
  position:relative;
  transition:background .24s, color .15s, box-shadow .24s;
  box-shadow:0 1.5px 7px 0 rgba(255,26,109,.05);
  border:1.5px solid var(--border);
  display: flex; flex-direction:column; align-items:center;
  gap:2px;
}
.sidebar-btn .sidebar-ico {
  font-size:23px; display:block; margin-bottom:2px;
  filter: drop-shadow(0 0 4px var(--pink-soft));
}
.sidebar-btn.active, .sidebar-btn:hover {
  color:var(--pink);
  background:var(--pink-soft);
  border-color:var(--pink);
  box-shadow:0 0 22px var(--pink-glow) inset;
}
#side-logged-user{
  margin-top:auto; color:var(--muted); font-size:13px;font-weight:700;letter-spacing:.05em;
  margin-bottom:14px;text-align:center;
  font-family:'Share Tech Mono',monospace;
}
#logoutSidebarBtn{
  background:none; border:1px solid var(--border);border-radius:4px;padding:8px 12px;color:var(--muted);margin-bottom:25px;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:color .18s,border-color .15s;
}
#logoutSidebarBtn:hover{color:var(--red);border-color:var(--red);}
.status-dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;margin:0 8px 0 0;vertical-align:middle;}

/* Offset page for sidebar */
#app {
  min-height: 100vh;
  margin-left: 115px;
}

.topbar {
  display:none;
}

/* --- PINK SMOKE/VOODOO ACCENT: example for modal --- */
.modal, .card, .stat-card {
  position:relative;
  z-index:1;
}
.modal::before, .card::before, .stat-card::before {
  content:'';
  position:absolute;z-index:0;left:-7px;top:-7px;right:-7px;bottom:-7px;
  pointer-events:none;
  background: radial-gradient(circle at 55% 30%, var(--pink-glow) 0,transparent 75%);
  opacity:.20;
  filter: blur(8px);
}
.modal *, .card *, .stat-card *{ position:relative; z-index:1;}


@media(max-width:900px){
  #sidebar{width:62px;}
  #sidebar .sidebar-logo{width:45px;height:45px;}
  #sidebar .sidebar-logo img{width:41px;height:41px;}
  #sidebar .sidebar-title{font-size:22px;}
  .sidebar-btn{width:52px;font-size:12px;padding:10px 0 3px;}
  .sidebar-btn .sidebar-ico{font-size:15px;}
  #app{margin-left:65px;}
}

/* Remainder: your original CSS for .page, .card, .field, .table, etc */
.page{display:none;padding:32px;max-width:1400px;margin:0 auto}
.page.active{display:block}
.page-header{display:flex;align-items:baseline;gap:16px;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:16px}
.page-title{font-family:'Bebas Neue',cursive;font-size:42px;letter-spacing:.1em;color:var(--pink)}
.page-subtitle{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}

button .sidebar-ico{pointer-events:none;} /* icon dont eat click */
</style>
</head>
<body>

<div id="syncDot">// SYNCING</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-logo">
    <img src="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAA[...]" alt="logo">
  </div>
  <div class="sidebar-title">BLOODLINE</div>
  <div class="sidebar-nav">
    <button class="sidebar-btn active" id="navBtn-calendar" onclick="goPage('calendar')"><span class="sidebar-ico">📅</span>Calendar</button>
    <button class="sidebar-btn" id="navBtn-treasury" onclick="goPage('treasury')"><span class="sidebar-ico">💰</span>Treasury</button>
    <button class="sidebar-btn" id="navBtn-inventory" onclick="goPage('inventory')"><span class="sidebar-ico">🗡️</span>Inventory</button>
    <button class="sidebar-btn" id="navBtn-crafting" onclick="goPage('crafting')"><span class="sidebar-ico">🧪</span>Crafting</button>
    <button class="sidebar-btn" id="navBtn-admin" onclick="goPage('admin')" style="display:none"><span class="sidebar-ico">🧑‍💼</span>Admin</button>
  </div>
  <div id="side-logged-user"></div>
  <button id="logoutSidebarBtn" onclick="doLogout()">LOGOUT</button>
</div>

<!-- LOGIN -->
<div id="loginScreen" style="z-index:1030;background:var(--black)">
  <img src="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAA[...]" style="width:120px">
  <div class="login-sub">// SECURE ACCESS REQUIRED</div>
  <div class="login-box">
    <input type="text" id="loginUser" placeholder="CODENAME" autocomplete="off">
    <input type="password" id="loginPass" placeholder="PASSWORD" autocomplete="off">
    <button class="btn-pink" onclick="doLogin()">ENTER</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- CALENDAR PAGE -->
  <div class="page active" id="page-calendar">
    <div class="page-header">
      <div class="page-title" style="filter:drop-shadow(0 0 8px var(--pink-glow));">Calendar</div>
      <div class="page-subtitle">// OPERATIONS & EVENTS</div>
      <!-- REMOVED "CREATE EVENT" BUTTON -->
    </div>
    <div class="card">
      <div class="cal-header">
        <button class="cal-nav" onclick="calPrev()">&#8592;</button>
        <div class="cal-month" id="calMonthLabel"></div>
        <button class="cal-nav" onclick="calNext()">&#8594;</button>
      </div>
      <div class="cal-grid">
        <div class="cal-day-name">SUN</div><div class="cal-day-name">MON</div><div class="cal-day-name">TUE</div>
        <div class="cal-day-name">WED</div><div class="cal-day-name">THU</div><div class="cal-day-name">FRI</div><div class="cal-day-name">SAT</div>
      </div>
      <div class="cal-grid" id="calBody" style="margin-top:4px"></div>
    </div>
  </div>

  <!-- TREASURY PAGE -->
  <div class="page" id="page-treasury"> ... </div>
  <!-- INVENTORY PAGE -->
  <div class="page" id="page-inventory"> ... </div>
  <!-- CRAFTING PAGE -->
  <div class="page" id="page-crafting"> ... </div>
  <!-- ADMIN PAGE -->
  <div class="page" id="page-admin"> ... </div>
  <!-- FOOTER -->
  <footer> <div class="footer-tagline"> <em>Blood</em> makes you related.<em>Loyalty</em> makes you family. </div> </footer>
</div>

<!-- CALENDAR MODAL -->
<div class="modal-overlay" id="calModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="modal-title" style="margin-bottom:0" id="calModalTitle"></div>
      <button class="btn-pink" onclick="toggleAddForm()" id="addEvBtn" style="font-size:13px;padding: 7px 16px;">+ ADD EVENT</button>
    </div>
    <div id="calModalEvents"></div>
    <div id="addEvForm" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
      <div class="card-title" style="font-size:16px;margin-bottom:12px">New Event</div>
      <div class="field"><label>Event Title</label><input type="text" id="evTitle" placeholder="Operation name..."></div>
      <div class="field"><label>Time</label><input type="text" id="evTime" placeholder="e.g. 9:00 PM"></div>
      <div class="field"><label>Notes</label><textarea id="evNotes" rows="3" placeholder="Details..." style="resize:vertical"></textarea></div>
      <div class="modal-actions" style="margin-top:8px">
        <button class="btn-ghost" onclick="toggleAddForm()">Cancel</button>
        <button class="btn-sm" onclick="saveEvent()">Save Event</button>
      </div>
    </div>
    <div class="modal-actions" style="margin-top:16px;justify-content:flex-start">
      <button class="btn-ghost" onclick="closeCalModal()">Close</button>
    </div>
  </div>
</div>

<script>
// SIDEBAR NAV: Highlight etc
function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.sidebar-btn').forEach(b=>b.classList.remove('active'));
  var btn=document.getElementById('navBtn-'+name);
  if(btn)btn.classList.add('active');
}

// Show logged user & admin btn in sidebar
function updateSidebarUser(user){
  document.getElementById('side-logged-user').innerHTML =
    '<span class="status-dot"></span>'+ (user?user.name:'');
  document.getElementById('navBtn-admin').style.display=user&&user.role==='admin'?'':'none';
}

// (No more calendarCreateEventClick etc changes)

let db, fs;
function onDbReady(cb){
  if(window._dbReady){db=window._db;fs=window._fs;cb();}
  else document.addEventListener('dbReady',()=>{db=window._db;fs=window._fs;cb();});
}

// ... (the rest of your JS code, all as in your original except for any previous calendar modal modifications)

async function doLogin(){
  const u=document.getElementById('loginUser').value.trim().toUpperCase();
  const p=document.getElementById('loginPass').value;
  const snap=await fs.getDocs(fs.collection(db,'users'));
  let found=null;
  snap.forEach(d=>{const data=d.data();if(data.name===u&&data.pass===p)found={id:d.id,...data};});
  // First-ever login: bootstrap default admin
  if(snap.empty){
    await fsSet('users','boss',{name:'BOSS',pass:'bloodline2024',role:'admin'});
    if(u==='BOSS'&&p==='bloodline2024')found={id:'boss',name:'BOSS',pass:'bloodline2024',role:'admin'};
  }
  if(found){
    currentUser=found;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    updateSidebarUser(found);
    startListeners();
    goPage('calendar');
  } else {
    const err=document.getElementById('loginErr');
    err.textContent='// ACCESS DENIED — INVALID CREDENTIALS';
    setTimeout(()=>err.textContent='',3000);
  }
}

//... (remainder unchanged)
onDbReady(()=>{ addIngRow(); });
</script>

<!-- EVENT DETAIL MODAL -->
<div class="modal-overlay" id="evDetailModal">
  <div class="modal" style="width:400px">
    <div class="modal-title" id="evDetailTitle"></div>
    <div id="evDetailTime" style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--pink);letter-spacing:.15em;margin-bottom:16px"></div>
    <div id="evDetailNotes" style="color:var(--text);font-size:15px;line-height:1.6;white-space:pre-wrap"></div>
    <div class="modal-actions" style="margin-top:20px">
      <button class="btn-ghost" id="evDetailDeleteBtn">DELETE EVENT</button>
      <button class="btn-sm" onclick="closeEvDetail()">CLOSE</button>
    </div>
  </div>
</div>

</body>
</html>
