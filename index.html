<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

try { await signInAnonymously(auth); } catch(e) {}

window.db = db;
window.fs = { collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc };

loadRecipes();
loadJobs();
</script>

<style>
body { font-family: Arial; background:#0f0f0f; color:#fff; padding:20px }
.section { margin-bottom:40px }
.card { background:#1a1a1a; padding:10px; margin-bottom:10px; border-radius:6px }
input, textarea, select { width:100%; padding:8px; margin-bottom:10px; background:#111; border:1px solid #333; color:#fff }
button { padding:8px 12px; margin-right:5px; background:#ff1a6d; border:none; color:#fff; cursor:pointer }
.small { font-size:12px; color:#aaa }
</style>
</head>
<body>

<h1>Control Panel</h1>

<div class="section">
  <h2>Recipes</h2>
  <input id="recipeName" placeholder="Recipe name">
  <textarea id="ingredients" placeholder="Metal:2, Plastic:1"></textarea>
  <button onclick="addRecipe()">Add Recipe</button>
  <div id="recipeList"></div>
</div>

<div class="section">
  <h2>Job Log</h2>

  <select id="jobUser">
    <option value="">Select User</option>
    <option>John</option>
    <option>Mike</option>
    <option>Sarah</option>
  </select>

  <input id="jobName" placeholder="Job name">
  <textarea id="jobReward" placeholder="170 Marked Bands, $25000"></textarea>
  <button onclick="addJob()">Log Job</button>

  <h3>Payout Settings</h3>
  <input id="gangPercent" type="number" placeholder="Gang % (e.g. 40)">
  <input id="playerPercent" type="number" placeholder="Player % (e.g. 60)">

  <h3>Weekly Totals</h3>
  <div id="weeklyTotals"></div>

  <div id="jobList"></div>
</div>

<script>

// --- RECIPE ---
async function addRecipe() {
  const name = recipeName.value;
  const ingredients = ingredientsParse(ingredients.value);
  await fs.addDoc(fs.collection(db, "recipes"), { name, ingredients, createdAt: Date.now() });
}

function ingredientsParse(raw) {
  return raw.split(",").map(i => {
    const [n,q] = i.split(":");
    return { name:n.trim(), qty:Number(q) };
  });
}

function loadRecipes() {
  fs.onSnapshot(fs.collection(db, "recipes"), snap => {
    recipeList.innerHTML = "";
    snap.forEach(d => {
      const r = d.data();
      recipeList.innerHTML += `<div class="card"><b>${r.name}</b><br>${r.ingredients.map(i=>i.name+" x"+i.qty).join("<br>")}</div>`;
    });
  });
}

// --- JOBS ---
async function addJob() {
  await fs.addDoc(fs.collection(db, "jobs"), {
    user: jobUser.value,
    job: jobName.value,
    reward: jobReward.value,
    createdAt: Date.now()
  });
}

function loadJobs() {
  fs.onSnapshot(fs.collection(db, "jobs"), snap => {
    jobList.innerHTML = "";

    const weekly = {};
    const now = Date.now();
    const weekAgo = now - (7*24*60*60*1000);

    snap.forEach(d => {
      const j = d.data();
      const id = d.id;

      jobList.innerHTML += `
        <div class="card">
          <b>${j.user}</b> - ${j.job}<br>
          ${j.reward}<br>
          <span class="small">${new Date(j.createdAt).toLocaleString()}</span><br>
          <button onclick="deleteJob('${id}')">Delete</button>
          <button onclick="editJob('${id}','${j.user}','${j.job}','${j.reward}')">Edit</button>
        </div>
      `;

      if (j.createdAt > weekAgo) {
        const value = parseMoney(j.reward);
        if (!weekly[j.user]) weekly[j.user] = { jobs: 0, total: 0 };

        weekly[j.user].jobs++;
        weekly[j.user].total += value;
      }
    });

    calculatePayouts(weekly);
  });
}

// --- MONEY PARSER ---
function parseMoney(text) {
  if (!text) return 0;

  // match numbers like 25000 or 25,000
  const matches = text.match(/\$?\d{1,3}(,\d{3})*|\d+/g);
  if (!matches) return 0;

  return matches.reduce((sum, val) => {
    const clean = val.replace(/,/g, "");
    return sum + Number(clean);
  }, 0);
}

// --- PAYOUT CALC ---
function calculatePayouts(weekly) {
  const gangPercent = Number(gangPercentInput.value || 0);
  const playerPercent = Number(playerPercentInput.value || 0);

  let html = "";

  Object.entries(weekly).forEach(([user, data]) => {
    const total = data.total;
    const gangCut = total * (gangPercent / 100);
    const playerCut = total * (playerPercent / 100);

    html += `
      <div class="card">
        <b>${user}</b><br>
        Jobs: ${data.jobs}<br>
        Total Earned: $${total}<br>
        Gang: $${gangCut}<br>
        Player: $${playerCut}
      </div>
    `;
  });

  weeklyTotals.innerHTML = html;
}

// --- DELETE / EDIT ---
async function deleteJob(id) {
  await fs.deleteDoc(fs.doc(db, "jobs", id));
}

async function editJob(id, user, job, reward) {
  const newUser = prompt("User", user);
  const newJob = prompt("Job", job);
  const newReward = prompt("Reward", reward);

  await fs.updateDoc(fs.doc(db, "jobs", id), {
    user: newUser,
    job: newJob,
    reward: newReward
  });
}

// fix input refs
const gangPercentInput = document.getElementById("gangPercent");
const playerPercentInput = document.getElementById("playerPercent");

</script>

</body>
</html>
