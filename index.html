<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BLOODLINE — Access</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">
  <div class="scanlines"></div>
  <div class="noise"></div>

  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C12 2 5 11 5 16a7 7 0 0 0 14 0c0-5-7-14-7-14z" fill="var(--blood)"/></svg>
      </div>
      <h1 class="brand-title">BLOODLINE</h1>
      <p class="brand-sub">BLOOD MAKES YOU RELATED, LOYALTY MAKES YOU FAMILY</p>
    </div>

    <div class="login-box">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <h2 class="login-heading">IDENTIFY YOURSELF</h2>

      <div class="field-group">
        <label class="field-label">HANDLE</label>
        <input type="text" id="loginName" class="field-input" placeholder="your street name" autocomplete="off"/>
      </div>

      <div class="field-group">
        <label class="field-label">ACCESS CODE</label>
        <input type="password" id="loginPass" class="field-input" placeholder="••••••••"/>
      </div>



      <button class="btn-primary" onclick="doLogin()">ENTER THE BLOODLINE</button>

      <p id="loginError" class="login-error"></p>
      <p id="debugLine" style="font-family:monospace;font-size:0.6rem;color:#555;text-align:center;margin-top:0.5rem;word-break:break-all;min-height:1rem;"></p>
    </div>

    <p class="login-footer">BLOODLINE &copy; — Blood makes you related, Loyalty makes you Family.</p>
  </div>

  <!-- Firebase compat SDKs (no ES module imports needed) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ============================================================
    // PASTE YOUR FIREBASE CONFIG HERE
    // ============================================================
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyC6El4QT2--ecQNWV18e-4L4s26iol_eUk",
      authDomain: "bloodline-efc76.firebaseapp.com",
      projectId: "bloodline-efc76",
      storageBucket: "bloodline-efc76.firebasestorage.app",
      messagingSenderId: "97046048461",
      appId: "1:97046048461:web:e1bdc760f130fb72830384"
    };
    // ============================================================

    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

    function debug(msg) {
      document.getElementById("debugLine").textContent = msg;
    }

async function doLogin() {
      const handle = document.getElementById("loginName").value.trim().toLowerCase();
      const pass   = document.getElementById("loginPass").value;
      const err    = document.getElementById("loginError");
      err.textContent = "";
      debug("Attempting login for: " + handle);

      if (!handle || !pass) {
        err.textContent = "⚠ Fill in all fields, soldier.";
        return;
      }

      try {
        debug("Connecting to Firestore...");
        const userDoc = await db.collection("users").doc(handle).get();
        debug("Response received. Found: " + userDoc.exists);

        if (!userDoc.exists) {
          err.textContent = "⚠ Unknown operative.";
          debug("No user doc found for: " + handle);
          return;
        }

        const data = userDoc.data();
        debug("User found. Checking PIN...");

        if (data.pin !== pass) {
          err.textContent = "⚠ Wrong code.";
          debug("PIN mismatch.");
          return;
        }

        debug("Access granted. Loading...");
        sessionStorage.setItem("bl_user",    handle);
        sessionStorage.setItem("bl_role",    data.role);
        sessionStorage.setItem("bl_display", data.displayName || handle);

        window.location.href = "pages/dashboard.html";

      } catch(e) {
        err.textContent = "⚠ System error.";
        debug("ERROR: " + e.message);
        console.error(e);
      }
    }

    document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    debug("System online. Awaiting identification.");
  </script>
</body>
</html>
