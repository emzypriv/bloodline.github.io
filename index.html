<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BLOODLINE — Access</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">
  <div class="scanlines"></div>
  <div class="noise"></div>

  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-icon">🩸</div>
      <h1 class="brand-title">BLOODLINE</h1>
      <p class="brand-sub">CREW MANAGEMENT SYSTEM</p>
    </div>

    <div class="login-box">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <h2 class="login-heading">IDENTIFY YOURSELF</h2>

      <div class="field-group">
        <label class="field-label">HANDLE</label>
        <input type="text" id="loginName" class="field-input" placeholder="your street name" autocomplete="off"/>
      </div>

      <div class="field-group">
        <label class="field-label">ACCESS CODE</label>
        <input type="password" id="loginPass" class="field-input" placeholder="••••••••"/>
      </div>

      <div class="role-select">
        <button class="role-btn active" id="roleBoss" onclick="selectRole('boss')">
          <span class="role-icon">👑</span> BOSS
        </button>
        <button class="role-btn" id="roleCrew" onclick="selectRole('crew')">
          <span class="role-icon">🔫</span> CREW
        </button>
      </div>

      <button class="btn-primary" onclick="doLogin()">ENTER THE BLOODLINE</button>

      <p id="loginError" class="login-error"></p>
      <p id="debugLine" style="font-family:monospace;font-size:0.6rem;color:#555;text-align:center;margin-top:0.5rem;word-break:break-all;min-height:1rem;"></p>
    </div>

    <p class="login-footer">BLOODLINE &copy; — STAY LOYAL. STAY QUIET.</p>
  </div>

  <!-- Firebase compat SDKs (no ES module imports needed) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ============================================================
    // PASTE YOUR FIREBASE CONFIG HERE
    // ============================================================
    const FIREBASE_CONFIG = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    // ============================================================

    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

    let selectedRole = "boss";

    function debug(msg) {
      document.getElementById("debugLine").textContent = msg;
    }

    function selectRole(role) {
      selectedRole = role;
      document.getElementById("roleBoss").classList.toggle("active", role === "boss");
      document.getElementById("roleCrew").classList.toggle("active", role === "crew");
    }

    async function doLogin() {
      const handle = document.getElementById("loginName").value.trim().toLowerCase();
      const pass   = document.getElementById("loginPass").value;
      const err    = document.getElementById("loginError");
      err.textContent = "";
      debug("Attempting: " + handle + " as " + selectedRole);

      if (!handle || !pass) {
        err.textContent = "⚠ Fill in all fields, soldier.";
        return;
      }

      try {
        debug("Connecting to Firestore...");
        const userDoc = await db.collection("users").doc(handle).get();
        debug("Response received. Found: " + userDoc.exists);

        if (!userDoc.exists) {
          err.textContent = "⚠ Unknown operative.";
          debug("No user doc found for: " + handle);
          return;
        }

        const data = userDoc.data();
        debug("DB role: " + data.role + " | Chosen: " + selectedRole);

        if (data.pin !== pass) {
          err.textContent = "⚠ Wrong code.";
          debug("PIN mismatch.");
          return;
        }

        if (data.role !== selectedRole) {
          err.textContent = "⚠ Wrong access level selected.";
          debug("Role mismatch. Pick " + data.role + " on the buttons above.");
          return;
        }

        debug("Access granted. Loading...");
        sessionStorage.setItem("bl_user",    handle);
        sessionStorage.setItem("bl_role",    data.role);
        sessionStorage.setItem("bl_display", data.displayName || handle);

        window.location.href = data.role === "boss"
          ? "pages/boss-dashboard.html"
          : "pages/crew-dashboard.html";

      } catch(e) {
        err.textContent = "⚠ System error.";
        debug("ERROR: " + e.message);
        console.error(e);
      }
    }

    document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    debug("System online. Awaiting identification.");
  </script>
</body>
</html>
